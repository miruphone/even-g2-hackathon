<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Warden demo overlay</title>
<!--
  1920x1080 transparent overlay for recording the demo (an OBS browser source on
  top of the G2Sim window): a simulated Telegram panel on the right, captions,
  and a hint for each ring gesture. Served by tgmock at /stage, driven by
  tools/demo/run.ts through POST /mock/stage.
-->
<style>
  :root {
    --panel: rgba(23, 33, 43, .96); --bubble: #182533; --bubble-bot: #2b5278; --line: #0e1621;
    --text: #f5f7fa; --dim: #7f91a4; --accent: #6ab3f3; --ok: #5fd38d; --warn: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; color: var(--text); font: 17px/1.38 "Segoe UI", system-ui, sans-serif; }
  #panel { position: absolute; top: 28px; right: 28px; bottom: 28px; width: 610px; background: var(--panel); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
  #panel > .top { padding: 12px 18px 10px; font-size: 13px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.06); }
  .chats { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid rgba(255,255,255,.06); transition: background .4s; }
  .chat.hot { background: rgba(106,179,243,.07); }
  .chat:last-child { border-bottom: 0; }
  .head { display: flex; align-items: center; gap: 12px; padding: 9px 16px; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
  .head .t { font-weight: 650; font-size: 17px; }
  .head .s { font-size: 13px; color: var(--dim); }
  .lock { margin-left: auto; font-size: 13px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 10px; }
  .msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; padding: 2px 16px 12px; }
  .m { flex-shrink: 0; max-width: 92%; background: var(--bubble); border-radius: 14px 14px 14px 4px; padding: 6px 11px 5px; align-self: flex-start; transition: opacity .9s, transform .9s, max-height .9s .5s, padding .9s .5s, margin .9s .5s; max-height: 220px; overflow: hidden; }
  .m .n { font-weight: 650; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .m .n i { font-style: normal; font-weight: 500; font-size: 11px; color: var(--dim); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 0 5px; }
  .m .x { word-break: break-word; white-space: pre-wrap; }
  .m .tm { float: right; font-size: 11px; color: var(--dim); margin: 6px 0 0 10px; }
  .m.bot { background: var(--bubble-bot); }
  .m.gone { opacity: 0; transform: translateX(-30px); max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: -5px; }
  .m.new { animation: pop .35s ease-out; }
  .svc { flex-shrink: 0; align-self: center; font-size: 13px; color: #dfe6ee; background: rgba(0,0,0,.28); border-radius: 999px; padding: 2px 12px; animation: pop .35s ease-out; }
  .me { align-self: flex-end; background: #2b5278; border-radius: 14px 14px 4px 14px; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  .btns span { flex: 1; text-align: center; background: rgba(255,255,255,.08); border-radius: 8px; padding: 6px 8px; font-weight: 600; font-size: 14px; color: var(--accent); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

  #caption { position: absolute; left: 40px; bottom: 40px; width: 1180px; padding: 18px 26px 20px; background: rgba(8, 12, 16, .78); border-radius: 16px; border-left: 4px solid var(--ok); transition: opacity .5s; }
  #caption.off { opacity: 0; }
  #caption .c { font-size: 32px; font-weight: 650; line-height: 1.22; }
  #caption .s { font-size: 21px; color: #b9c6d2; margin-top: 6px; }
  #gesture { position: absolute; left: 570px; top: 690px; width: 400px; text-align: center; opacity: 0; transition: opacity .25s; }
  #gesture span { display: inline-flex; gap: 12px; align-items: center; background: rgba(8,12,16,.8); border: 2px solid var(--ok); color: #e9fff0; border-radius: 999px; padding: 9px 22px; font-size: 24px; font-weight: 650; }
  #gesture b { display: inline-block; width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--ok); }
  #gesture.on { opacity: 1; }
  #title { position: absolute; left: 0; top: 0; width: 1290px; height: 1080px; display: grid; place-items: center; background: radial-gradient(closest-side, rgba(0,0,0,.72), rgba(0,0,0,.35)); transition: opacity .8s; text-align: center; }
  #title.off { opacity: 0; }
  #title h1 { font-size: 96px; margin: 0; letter-spacing: .02em; }
  #title p { font-size: 30px; margin: 10px 0 0; color: #cfe; }
  #title small { display: block; margin-top: 26px; font-size: 20px; color: #9fb; }
</style>
</head>
<body>
<div id="title" class="off"><div><h1 id="tt"></h1><p id="ts"></p><small id="tf"></small></div></div>
<div id="panel"><div class="top"><span id="ptitle">Telegram · simulated for this demo</span><span id="pclock"></span></div><div class="chats" id="chats"></div></div>
<div id="caption" class="off"><div class="c" id="cap"></div><div class="s" id="sub"></div></div>
<div id="gesture"><span><b></b><em id="gname" style="font-style:normal"></em></span></div>
<script>
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const COLORS = ['#e17076', '#7bc862', '#e5ca77', '#65aadd', '#a695e7', '#ee7aae', '#6ec9cb', '#faa774']
const color = n => COLORS[Math.abs(n) % COLORS.length]
const initials = t => t.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase()
const hhmm = d => { const t = new Date(d * 1000); return `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` }
const seen = new Set()
let mode = ''
let lastCount = {}
let voiceAt = 0
let audio = null
// Preload every narration clip so playback starts on cue.
const clips = new Map()
fetch('/mock/voices').then(r => r.json()).then(ids => { for (const id of ids) { const a = new Audio(`/voice/${id}.wav`); a.preload = 'auto'; a.load(); clips.set(id, a) } }).catch(() => {})

function msgHtml(m) {
  if (m.service) return `<div class="svc" data-id="${m.id}">${esc(m.service)}</div>`
  const badge = m.bot ? '<i>bot</i>' : m.admin ? '<i>admin</i>' : ''
  return `<div class="m ${m.bot ? 'bot' : ''}" data-id="${m.id}"><div class="n" style="color:${m.bot ? '#9fd0ff' : color(m.uid)}">${esc(m.from)}${badge}</div><div class="x">${esc(m.text)}<span class="tm">${hhmm(m.date)}</span></div></div>`
}

/** Keyed update so new messages pop in and deleted ones fade out instead of jumping. */
function syncList(box, items, html) {
  const have = new Map([...box.children].map(el => [el.dataset.id, el]))
  for (const it of items) {
    let el = have.get(String(it.id))
    if (!el) {
      const tmp = document.createElement('div')
      tmp.innerHTML = html(it)
      el = tmp.firstElementChild
      if (seen.has(it.id)) el.classList.remove('new'); else { el.classList.add('new'); seen.add(it.id) }
      box.appendChild(el)
    }
    if (it.deleted) {
      if (!el.classList.contains('gone')) requestAnimationFrame(() => el.classList.add('gone'))
      if (it.deletedAt && Date.now() - it.deletedAt > 2500) el.style.display = 'none'
    }
  }
}

function renderGroups(s) {
  const box = $('chats')
  if (mode !== 'groups') {
    mode = 'groups'
    box.innerHTML = s.chats.map(c => `<section class="chat" id="c${c.id}"><div class="head"><div class="av" style="background:${color(c.id)}">${initials(c.title)}</div><div><div class="t">${esc(c.title)}</div><div class="s"></div></div></div><div class="msgs"></div></section>`).join('')
  }
  for (const c of s.chats) {
    const sec = $('c' + c.id)
    sec.querySelector('.s').textContent = `${c.memberCount.toLocaleString('en-US')} members`
    let lock = sec.querySelector('.lock')
    if (c.locked && !lock) sec.querySelector('.head').insertAdjacentHTML('beforeend', '<span class="lock">🔒 paused</span>')
    if (!c.locked && lock) lock.remove()
    const msgs = c.messages.filter(m => m.text || m.service)
    syncList(sec.querySelector('.msgs'), msgs.slice(-14), msgHtml)
    const n = msgs.length
    if (lastCount[c.id] !== undefined && n > lastCount[c.id]) { sec.classList.add('hot'); setTimeout(() => sec.classList.remove('hot'), 1200) }
    lastCount[c.id] = n
  }
}

function renderDm(s) {
  const box = $('chats')
  if (mode !== 'dm') {
    mode = 'dm'
    box.innerHTML = `<section class="chat"><div class="head"><div class="av" style="background:#4f8fd6">W</div><div><div class="t">${esc(s.bot.first_name)}</div><div class="s">bot · @${esc(s.bot.username)}</div></div></div><div class="msgs" id="dmmsgs"></div></section>`
  }
  const items = s.dms.map(d => ({ ...d, id: 'dm' + d.at + d.from }))
  syncList($('dmmsgs'), items, d => d.from === 'bot'
    ? `<div class="m bot" data-id="${esc(d.id)}"><div class="x">${esc(d.text)}</div>${d.buttons?.length ? `<div class="btns">${d.buttons.map(b => `<span>${esc(b.text)}</span>`).join('')}</div>` : ''}</div>`
    : `<div class="m me" data-id="${esc(d.id)}"><div class="x">${esc(d.text)}</div></div>`)
}

async function tick() {
  let s
  try { s = await (await fetch('/mock/state?from=stage')).json() } catch { return }
  const st = s.stage
  if (st.mode === 'dm') renderDm(s); else renderGroups(s)
  $('cap').textContent = st.caption
  $('sub').textContent = st.sub
  $('caption').classList.toggle('off', !st.caption)
  const [tt, ts, tf] = (st.title || '').split('|')
  if (tt) { $('tt').textContent = tt; $('ts').textContent = ts ?? ''; $('tf').textContent = tf ?? '' }
  $('title').classList.toggle('off', !st.title)
  // Narration: each new clip replaces the previous one. OBS records it through the browser source.
  if (st.voice && st.voice.at !== voiceAt) {
    const fresh = voiceAt !== 0 || Date.now() - st.voice.at < 3000
    voiceAt = st.voice.at
    if (fresh) {
      audio?.pause()
      audio = clips.get(st.voice.id) ?? new Audio(`/voice/${st.voice.id}.wav`)
      audio.currentTime = 0
      audio.volume = 0.8 // headroom: the TTS clips peak at full scale
      audio.play().catch(() => {})
    }
  }
  const g = st.gesture
  const on = g && Date.now() - g.at < 1500
  if (g) $('gname').textContent = g.name
  $('gesture').classList.toggle('on', !!on)
  const d = new Date()
  $('pclock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
}
setInterval(tick, 200)
tick()
</script>
</body>
</html>
