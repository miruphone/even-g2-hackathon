<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Warden</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        /* Even app dark surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; gap: 12px; }
      header { display: flex; align-items: baseline; gap: 8px; }
      h1 { font-size: 18px; margin: 0; font-weight: 650; }
      header span { color: #a3a3a3; font-size: 13px; }
      .card { background: #2c2c2c; border-radius: 12px; padding: 12px 14px; }
      .label { font-size: 11px; color: #a3a3a3; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
      p { margin: 4px 0; }
      .code { font: 600 22px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9ae6a0; margin: 8px 0 12px; user-select: all; }
      .button { display: inline-block; background: #E5E5E5; color: #232323; border-radius: 999px; padding: 9px 18px; font-weight: 600; text-decoration: none; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { padding: 8px 0; border-bottom: 1px solid #383838; }
      li:last-child { border-bottom: 0; }
      .row { display: flex; justify-content: space-between; gap: 8px; }
      .kind { color: #a3a3a3; font-size: 12px; text-transform: uppercase; }
      .meta { color: #c9c9c9; font-size: 13px; }
      .sample, .warning { margin-top: 4px; font-size: 12px; color: #a3a3a3; border-left: 2px solid #4a4a4a; padding-left: 8px; word-break: break-word; }
      .sev4 b, .sev3 b { color: #ffb4a8; }
      .ok { color: #9ae6a0; } .bad { color: #ffb4a8; } .dim { color: #8a8a8a; }
      small { color: #8a8a8a; }
    </style>
  </head>
  <body>
    <div id="app">
      <header><h1>Warden</h1><span>Telegram group guard for G2</span></header>
      <div class="card"><div id="status">Starting…</div></div>
      <div class="card" id="pair" hidden></div>
      <div class="card"><div class="label">Needs a decision</div><ul id="queue"></ul></div>
      <div class="card"><div class="label">Done</div><ul id="recent"></ul></div>
      <div class="card"><div class="label">Groups</div><ul id="groups"></ul></div>
      <div class="card"><div class="label">Log</div><ul id="log" style="font: 11px/1.5 ui-monospace, monospace; color:#9a9a9a; max-height: 160px; overflow-y: auto"></ul></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
